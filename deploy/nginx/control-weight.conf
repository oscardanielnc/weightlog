# =============================================================================
#  Mi Peso — configuración de Nginx para la VM de Oracle Cloud
#
#  Sirve el sitio de producto en / y la aplicación instalable en /app/.
#  Copiar a /etc/nginx/sites-available/control-weight.conf y enlazar en
#  sites-enabled. Reemplazar TU_DOMINIO por el dominio real antes de usar.
# =============================================================================

# Tipos que Nginx no conoce de fábrica.
types {
    application/wasm wasm;
    application/manifest+json webmanifest;
}

# --- Redirección a HTTPS -----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    # Certbot necesita este directorio para renovar el certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Sitio ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name TU_DOMINIO;

    root /var/www/control-weight;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- Cabeceras de seguridad ---------------------------------------------
    include snippets/control-weight-seguridad.conf;
    add_header X-Robots-Tag "index, follow" always;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

    # --- Caché ---------------------------------------------------------------
    # Los archivos con hash en el nombre son inmutables; el HTML y el service
    # worker nunca se cachean para que una nueva versión llegue de inmediato.
    location ~* /(estaticos|assets)/ {
        include snippets/control-weight-seguridad.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /app/sw.js {
        include snippets/control-weight-seguridad.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /app/manifest.webmanifest {
        include snippets/control-weight-seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.html$ {
        include snippets/control-weight-seguridad.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # La aplicación es una SPA: cualquier ruta dentro de /app/ devuelve su index.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Nada de listados de directorio ni archivos ocultos.
    autoindex off;

    location ~ /\. {
        deny all;
    }
}
