# Sitio de Mi Peso servido por Nginx y publicado a través del túnel de
# Cloudflare que ya corre en la máquina. Solo escucha en la interfaz local:
# nada queda expuesto directamente a internet.
services:
  web:
    image: nginx:alpine
    container_name: mi-peso-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUERTO:-8082}:80"
    # La `z` de cada montaje reetiqueta los archivos para SELinux, que en
    # Oracle Linux está en modo enforcing y si no bloquearía la lectura.
    volumes:
      - ../../sitio:/usr/share/nginx/html:ro,z
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./seguridad.conf:/etc/nginx/snippets/seguridad.conf:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 60s
      timeout: 5s
      retries: 3
