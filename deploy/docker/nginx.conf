# =============================================================================
#  Mi Peso — servidor del sitio dentro del contenedor.
#
#  El TLS y el certificado los pone Cloudflare al otro lado del túnel, así que
#  aquí solo se sirve HTTP en la red local del host. Las cabeceras de seguridad
#  sí se emiten desde el origen: viajan hasta el navegador.
# =============================================================================

server {
    listen 80;
    # La imagen de Nginx añade esta línea sola al arrancar, pero no puede
    # hacerlo aquí porque la configuración se monta de solo lectura. Sin ella,
    # `localhost` dentro del contenedor (que resuelve a ::1) no responde y el
    # healthcheck falla.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    autoindex off;

    include /etc/nginx/snippets/seguridad.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

    # Los archivos llevan un hash en el nombre: son inmutables.
    location ~* /(estaticos|assets)/ {
        include /etc/nginx/snippets/seguridad.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Imágenes y fuentes: no llevan hash en el nombre, así que no pueden
    # marcarse inmutables, pero sin cabecera el navegador revalidaba en cada
    # visita. Con el origen al otro lado del mundo, cada revalidación es un
    # viaje completo: una semana de caché elimina ese coste sin dejar una
    # captura vieja pegada durante meses.
    # Sin `expires`: esa directiva emite su propia cabecera Cache-Control y
    # acabarían viajando dos, así que el valor se declara una sola vez aquí.
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    # El service worker y el HTML nunca se cachean: así una versión nueva
    # llega al teléfono en la siguiente visita.
    location = /app/sw.js {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /app/manifest.webmanifest {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
