name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tipos, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Linter
        run: npm run lint

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Pruebas con cobertura
        run: npm run test:cobertura

      - name: Compilar aplicación y sitio
        run: |
          npm run build
          npm run sitio

      - name: Guardar el sitio compilado
        uses: actions/upload-artifact@v5
        with:
          name: sitio
          path: sitio/
          retention-days: 7

  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Falla solo ante vulnerabilidades altas o críticas: las moderadas
      # conocidas viven en la cadena de @capacitor/cli, que no se empaqueta.
      - name: npm audit
        run: npm audit --audit-level=high
